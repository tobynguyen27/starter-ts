catalogs:
  build:
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: ^0.2.0
  dev:
    vitest: ^4.1.9
  types:
    '@types/node': '^25.6.2'
    '@typescript/native-preview': 7.0.0-dev.20260618.1
    typescript: ^6.0.3
  scripts:
    bumpp: ^11.1.0
    taze: ^19.12.0
    actionspack: ^0.1.5

overrides:
  vite: 'catalog:build'
  vitest: 'catalog:dev'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
