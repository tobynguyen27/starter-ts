catalogs:
  build:
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: ^1.4.0
  dev:
    vitest: ^5.0.5
  types:
    '@types/node': '^26.6.6'
    '@typescript/native-preview': 7.0.0-dev.20260707.2
    typescript: ^7.0.2
    '@tobyngn/tsconfig': ^1.0.0
  scripts:
    bumpp: ^12.3.0
    taze: ^21.3.0

overrides:
  vite: 'catalog:build'
  vitest: 'catalog:dev'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
